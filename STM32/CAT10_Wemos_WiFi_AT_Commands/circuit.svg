<svg xmlns="http://www.w3.org/2000/svg" width="960" height="608" viewBox="0 0 960 608" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="960" height="608" fill="#ffffff"/>
<text x="480.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#24292f">CAT 10 — STM32 ↔ Wemos D1 mini (ESP8266) Wi-Fi modem</text>
<text x="480.0" y="58" font-size="13" text-anchor="middle" fill="#57606a">USART1 = AT commands to the Wemos, USART2 = debug terminal</text>
<rect x="30" y="78" width="400" height="426" rx="10" fill="#f6f8fa" stroke="#24292f" stroke-width="2"/>
<text x="48" y="261.0" font-size="15" font-weight="700" fill="#24292f">STM32 Blue Pill</text>
<text x="48" y="281.0" font-size="12" font-weight="400" fill="#24292f">STM32F103C8T6</text>
<text x="48" y="301.0" font-size="12" font-weight="400" fill="#24292f">Cortex-M3, 72 MHz</text>
<text x="48" y="321.0" font-size="12" font-weight="400" fill="#24292f">3.3 V logic</text>
<rect x="660" y="78" width="280" height="96" rx="8" fill="#fff8e6" stroke="#9a6700" stroke-width="1.6"/>
<text x="928" y="114.0" font-size="13" font-weight="700" text-anchor="end" fill="#6e4b00">Wemos D1 mini</text>
<text x="928" y="130.0" font-size="11" font-weight="400" text-anchor="end" fill="#6e4b00">ESP8266, AT firmware</text>
<text x="928" y="146.0" font-size="11" font-weight="400" text-anchor="end" fill="#6e4b00">powered from its USB</text>
<text x="422" y="100" font-size="12" font-weight="600" text-anchor="end" fill="#1a7f37">PA9 USART1_TX</text>
<circle cx="430" cy="96" r="4" fill="#1a7f37"/>
<line x1="430" y1="96" x2="660" y2="96" stroke="#1a7f37" stroke-width="2.4"/>
<circle cx="660" cy="96" r="4" fill="#1a7f37"/>
<text x="668" y="100" font-size="12" fill="#24292f">RX</text>
<rect x="496.0" y="86" width="98" height="20" rx="4" fill="#ffffff" stroke="#1a7f37"/>
<text x="545.0" y="100" font-size="11" text-anchor="middle" fill="#1a7f37">AT command →</text>
<text x="422" y="130" font-size="12" font-weight="600" text-anchor="end" fill="#1a7f37">PA10 USART1_RX</text>
<circle cx="430" cy="126" r="4" fill="#1a7f37"/>
<line x1="430" y1="126" x2="660" y2="126" stroke="#1a7f37" stroke-width="2.4"/>
<circle cx="660" cy="126" r="4" fill="#1a7f37"/>
<text x="668" y="130" font-size="12" fill="#24292f">TX</text>
<rect x="503.0" y="116" width="84" height="20" rx="4" fill="#ffffff" stroke="#1a7f37"/>
<text x="545.0" y="130" font-size="11" text-anchor="middle" fill="#1a7f37">← response</text>
<text x="422" y="160" font-size="12" font-weight="600" text-anchor="end" fill="#24292f">GND</text>
<circle cx="430" cy="156" r="4" fill="#24292f"/>
<line x1="430" y1="156" x2="660" y2="156" stroke="#24292f" stroke-width="2.4"/>
<circle cx="660" cy="156" r="4" fill="#24292f"/>
<text x="668" y="160" font-size="12" fill="#24292f">GND</text>
<rect x="503.0" y="146" width="84" height="20" rx="4" fill="#ffffff" stroke="#24292f"/>
<text x="545.0" y="160" font-size="11" text-anchor="middle" fill="#24292f">common GND</text>
<rect x="660" y="198" width="280" height="96" rx="8" fill="#fff8e6" stroke="#9a6700" stroke-width="1.6"/>
<text x="928" y="242.0" font-size="13" font-weight="700" text-anchor="end" fill="#6e4b00">USB-to-TTL (3.3 V)</text>
<text x="928" y="258.0" font-size="11" font-weight="400" text-anchor="end" fill="#6e4b00">→ PC, PuTTY 115200</text>
<text x="422" y="220" font-size="12" font-weight="600" text-anchor="end" fill="#1a7f37">PA2 USART2_TX</text>
<circle cx="430" cy="216" r="4" fill="#1a7f37"/>
<line x1="430" y1="216" x2="660" y2="216" stroke="#1a7f37" stroke-width="2.4"/>
<circle cx="660" cy="216" r="4" fill="#1a7f37"/>
<text x="668" y="220" font-size="12" fill="#24292f">RX</text>
<text x="422" y="250" font-size="12" font-weight="600" text-anchor="end" fill="#1a7f37">PA3 USART2_RX</text>
<circle cx="430" cy="246" r="4" fill="#1a7f37"/>
<line x1="430" y1="246" x2="660" y2="246" stroke="#1a7f37" stroke-width="2.4"/>
<circle cx="660" cy="246" r="4" fill="#1a7f37"/>
<text x="668" y="250" font-size="12" fill="#24292f">TX</text>
<text x="422" y="280" font-size="12" font-weight="600" text-anchor="end" fill="#24292f">GND</text>
<circle cx="430" cy="276" r="4" fill="#24292f"/>
<line x1="430" y1="276" x2="660" y2="276" stroke="#24292f" stroke-width="2.4"/>
<circle cx="660" cy="276" r="4" fill="#24292f"/>
<text x="668" y="280" font-size="12" fill="#24292f">GND</text>
<rect x="660" y="318" width="280" height="36" rx="8" fill="#fff8e6" stroke="#9a6700" stroke-width="1.6"/>
<text x="928" y="332.0" font-size="13" font-weight="700" text-anchor="end" fill="#6e4b00">On-board LED</text>
<text x="928" y="348.0" font-size="11" font-weight="400" text-anchor="end" fill="#6e4b00">10D: /led/on, /led/off</text>
<text x="422" y="340" font-size="12" font-weight="600" text-anchor="end" fill="#bc4c00">PC13</text>
<circle cx="430" cy="336" r="4" fill="#bc4c00"/>
<line x1="430" y1="336" x2="660" y2="336" stroke="#bc4c00" stroke-width="2.4"/>
<circle cx="660" cy="336" r="4" fill="#bc4c00"/>
<text x="668" y="340" font-size="12" fill="#24292f">LED (active-LOW)</text>
<rect x="660" y="378" width="280" height="126" rx="8" fill="#fff8e6" stroke="#9a6700" stroke-width="1.6"/>
<text x="928" y="437.0" font-size="13" font-weight="700" text-anchor="end" fill="#6e4b00">ST-LINK V2</text>
<text x="928" y="453.0" font-size="11" font-weight="400" text-anchor="end" fill="#6e4b00">programmer / debugger</text>
<text x="422" y="400" font-size="12" font-weight="600" text-anchor="end" fill="#bf8700">PA13</text>
<circle cx="430" cy="396" r="4" fill="#bf8700"/>
<line x1="430" y1="396" x2="660" y2="396" stroke="#bf8700" stroke-width="2.4"/>
<circle cx="660" cy="396" r="4" fill="#bf8700"/>
<text x="668" y="400" font-size="12" fill="#24292f">SWDIO</text>
<text x="422" y="430" font-size="12" font-weight="600" text-anchor="end" fill="#bf8700">PA14</text>
<circle cx="430" cy="426" r="4" fill="#bf8700"/>
<line x1="430" y1="426" x2="660" y2="426" stroke="#bf8700" stroke-width="2.4"/>
<circle cx="660" cy="426" r="4" fill="#bf8700"/>
<text x="668" y="430" font-size="12" fill="#24292f">SWCLK</text>
<text x="422" y="460" font-size="12" font-weight="600" text-anchor="end" fill="#d1242f">3V3</text>
<circle cx="430" cy="456" r="4" fill="#d1242f"/>
<line x1="430" y1="456" x2="660" y2="456" stroke="#d1242f" stroke-width="2.4"/>
<circle cx="660" cy="456" r="4" fill="#d1242f"/>
<text x="668" y="460" font-size="12" fill="#24292f">3.3 V</text>
<text x="422" y="490" font-size="12" font-weight="600" text-anchor="end" fill="#24292f">GND</text>
<circle cx="430" cy="486" r="4" fill="#24292f"/>
<line x1="430" y1="486" x2="660" y2="486" stroke="#24292f" stroke-width="2.4"/>
<circle cx="660" cy="486" r="4" fill="#24292f"/>
<text x="668" y="490" font-size="12" fill="#24292f">GND</text>
<line x1="30" y1="536" x2="52" y2="536" stroke="#d1242f" stroke-width="3"/><text x="58" y="540" font-size="11" fill="#57606a">power</text>
<line x1="142" y1="536" x2="164" y2="536" stroke="#24292f" stroke-width="3"/><text x="170" y="540" font-size="11" fill="#57606a">ground</text>
<line x1="254" y1="536" x2="276" y2="536" stroke="#bc4c00" stroke-width="3"/><text x="282" y="540" font-size="11" fill="#57606a">output</text>
<line x1="366" y1="536" x2="388" y2="536" stroke="#0969da" stroke-width="3"/><text x="394" y="540" font-size="11" fill="#57606a">input</text>
<line x1="478" y1="536" x2="500" y2="536" stroke="#1a7f37" stroke-width="3"/><text x="506" y="540" font-size="11" fill="#57606a">UART</text>
<line x1="590" y1="536" x2="612" y2="536" stroke="#8250df" stroke-width="3"/><text x="618" y="540" font-size="11" fill="#57606a">I²C</text>
<line x1="702" y1="536" x2="724" y2="536" stroke="#bf8700" stroke-width="3"/><text x="730" y="540" font-size="11" fill="#57606a">ISP/SWD</text>
<line x1="814" y1="536" x2="836" y2="536" stroke="#1b7c83" stroke-width="3"/><text x="842" y="540" font-size="11" fill="#57606a">timer/PWM</text>
<text x="30" y="566" font-size="12" fill="#57606a">• Both UARTs 115200-8-N-1; 10D also enables the USART1 global interrupt (NVIC)</text>
</svg>