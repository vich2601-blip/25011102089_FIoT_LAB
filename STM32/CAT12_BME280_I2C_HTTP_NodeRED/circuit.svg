<svg xmlns="http://www.w3.org/2000/svg" width="960" height="548" viewBox="0 0 960 548" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect width="960" height="548" fill="#ffffff"/>
<text x="480.0" y="34" font-size="20" font-weight="700" text-anchor="middle" fill="#24292f">CAT 12 — BME280 over I²C + ESP8266 HTTP server</text>
<text x="480.0" y="58" font-size="13" text-anchor="middle" fill="#57606a">Nucleo reads the BME280 (Bosch API), prints on USART6 and serves JSON through the Wemos</text>
