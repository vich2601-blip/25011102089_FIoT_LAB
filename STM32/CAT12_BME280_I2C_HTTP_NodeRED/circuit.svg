<text x="48" y="271.0" font-size="12" font-weight="400" fill="#24292f">Cortex-M4F, 84 MHz</text>
<text x="48" y="291.0" font-size="12" font-weight="400" fill="#24292f">HSE bypass 8 MHz (ST-LINK)</text>
