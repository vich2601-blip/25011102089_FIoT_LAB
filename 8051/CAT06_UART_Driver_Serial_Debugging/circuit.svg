<text x="48" y="146.0" font-size="12" font-weight="400" fill="#24292f">8051 development kit</text>
<text x="48" y="166.0" font-size="12" font-weight="400" fill="#24292f">11.0592 MHz crystal</text>
<text x="48" y="186.0" font-size="12" font-weight="400" fill="#24292f">5 V supply</text>
<rect x="660" y="78" width="280" height="96" rx="8" fill="#fff8e6" stroke="#9a6700" stroke-width="1.6"/>
