<line x1="254" y1="266" x2="276" y2="266" stroke="#bc4c00" stroke-width="3"/><text x="282" y="270" font-size="11" fill="#57606a">output</text>
<line x1="366" y1="266" x2="388" y2="266" stroke="#0969da" stroke-width="3"/><text x="394" y="270" font-size="11" fill="#57606a">input</text>
<line x1="478" y1="266" x2="500" y2="266" stroke="#1a7f37" stroke-width="3"/><text x="506" y="270" font-size="11" fill="#57606a">UART</text>
<line x1="590" y1="266" x2="612" y2="266" stroke="#8250df" stroke-width="3"/><text x="618" y="270" font-size="11" fill="#57606a">I²C</text>
<line x1="702" y1="266" x2="724" y2="266" stroke="#bf8700" stroke-width="3"/><text x="730" y="270" font-size="11" fill="#57606a">ISP/SWD</text>
<line x1="814" y1="266" x2="836" y2="266" stroke="#1b7c83" stroke-width="3"/><text x="842" y="270" font-size="11" fill="#57606a">timer/PWM</text>
<text x="30" y="296" font-size="12" fill="#57606a">• Timer 1 Mode 2, TH1 = 0xFD → 11.0592 MHz / (384 × 3) = 9600 baud</text>
<text x="30" y="318" font-size="12" fill="#57606a">• TX and RX are crossed</text>
</svg>