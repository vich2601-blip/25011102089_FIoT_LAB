<text x="545.0" y="130" font-size="11" text-anchor="middle" fill="#1a7f37">RX ← TX</text>
<text x="422" y="160" font-size="12" font-weight="600" text-anchor="end" fill="#24292f">GND</text>
<circle cx="430" cy="156" r="4" fill="#24292f"/>
<line x1="430" y1="156" x2="660" y2="156" stroke="#24292f" stroke-width="2.4"/>
<circle cx="660" cy="156" r="4" fill="#24292f"/>
<text x="668" y="160" font-size="12" fill="#24292f">GND</text>
<rect x="503.0" y="146" width="84" height="20" rx="4" fill="#ffffff" stroke="#24292f"/>
<text x="545.0" y="160" font-size="11" text-anchor="middle" fill="#24292f">common GND</text>
