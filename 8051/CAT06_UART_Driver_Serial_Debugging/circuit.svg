<text x="928" y="212.0" font-size="13" font-weight="700" text-anchor="end" fill="#6e4b00">On-board LED</text>
<text x="928" y="228.0" font-size="11" font-weight="400" text-anchor="end" fill="#6e4b00">Task C heartbeat</text>
<text x="422" y="220" font-size="12" font-weight="600" text-anchor="end" fill="#bc4c00">P1.0</text>
<circle cx="430" cy="216" r="4" fill="#bc4c00"/>
<line x1="430" y1="216" x2="660" y2="216" stroke="#bc4c00" stroke-width="2.4"/>
