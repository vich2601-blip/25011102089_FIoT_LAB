<line x1="430" y1="96" x2="660" y2="96" stroke="#1a7f37" stroke-width="2.4"/>
<circle cx="660" cy="96" r="4" fill="#1a7f37"/>
<text x="668" y="100" font-size="12" fill="#24292f">RX</text>
<rect x="513.5" y="86" width="63" height="20" rx="4" fill="#ffffff" stroke="#1a7f37"/>
<text x="545.0" y="100" font-size="11" text-anchor="middle" fill="#1a7f37">TX → RX</text>
<text x="422" y="130" font-size="12" font-weight="600" text-anchor="end" fill="#1a7f37">P3.0 RXD</text>
<circle cx="430" cy="126" r="4" fill="#1a7f37"/>
<line x1="430" y1="126" x2="660" y2="126" stroke="#1a7f37" stroke-width="2.4"/>
<circle cx="660" cy="126" r="4" fill="#1a7f37"/>
<text x="668" y="130" font-size="12" fill="#24292f">TX</text>
